<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head></head>

<body>
    <header class="sticky-top admin-header" th:fragment="adminHeader(activePage)">
        <nav class="navbar navbar-expand-lg navbar-dark container-fluid admin-navbar">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/administracion}">
                <img th:src="@{/images/logo.png}" class="site-logo" alt="Little Doky's Hub">
                <span class="d-flex flex-column">
                    <strong>Little Doky's Hub</strong>
                    <small class="admin-header-caption">Administración</small>
                </span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#adminNavigation" aria-controls="adminNavigation" aria-expanded="false"
                aria-label="Abrir menú de administración">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="adminNavigation">
                <ul class="navbar-nav me-auto admin-navigation">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'products'} ? 'active' : ''"
                            th:href="@{/administracion}"><i class="bi bi-box-seam me-1"></i>Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'gestion'} ? 'active' : ''"
                            th:href="@{/administracion/gestion}"><i class="bi bi-tags me-1"></i>Catálogo</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3 admin-session">
                    <span class="text-white small fw-semibold">
                        <i class="bi bi-person-circle text-warning me-1" aria-hidden="true"></i>
                        <span th:text="${sesionNombre}">Administrador</span>
                    </span>
                    <form th:action="@{/logout}" method="post" class="mb-0">
                        <button class="btn btn-outline-light btn-sm" type="submit">
                            <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Salir
                        </button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
