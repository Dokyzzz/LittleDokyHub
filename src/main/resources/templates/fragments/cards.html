<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head></head>

<body>
    <div class="col-12 col-md-4 fade-up" th:fragment="tarjetaProducto(prod)">
        <div class="card h-100 shadow-sm card-pizza position-relative">
            
            <span th:if="${prod.categoria != null}"
                class="position-absolute top-0 end-0 m-2 badge bg-dark bg-opacity-75 text-white rounded-pill px-2 py-1 small category-badge">
                <i th:if="${prod.categoria.icono != null}" th:class="'bi ' + ${prod.categoria.icono} + ' me-1'"></i>
                <span th:text="${prod.categoria.nombre}">Categoría</span>
            </span>

            <div class="overflow-hidden">
                <a
                    th:href="@{/personalizar/{id}(id=${prod.id})}">
                    <img th:src="@{${prod.imagenUrl}}" class="card-img-top img-card" th:alt="${prod.nombre}">
                </a>
            </div>

            <div class="card-body d-flex flex-column">
                <a th:href="@{/personalizar/{id}(id=${prod.id})}"
                    class="text-decoration-none text-dark">
                    <h5 class="card-title fw-bold" th:text="${prod.nombre}">Nombre Producto</h5>
                </a>

                <p class="card-text text-muted small" th:text="${prod.descripcion}">Descripción del producto.</p>

                <div class="mt-auto d-flex justify-content-between align-items-center">
                    <span class="fw-bold fs-5" th:text="'S/ ' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">S/
                        0.00</span>
                    <a class="btn btn-main btn-sm" th:href="@{/personalizar/{id}(id=${prod.id})}">
                        <i class="bi bi-sliders me-1"></i>Personalizar
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
