<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Doky's Hub - Pizzería Artesanal</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header('inicio')}"></div>

    <main>
        <section class="banner-principal text-center py-5">
            <div class="container py-4">
                <h1 class="display-5 fw-bold mb-3">Pizzas Artesanales a la Leña</h1>
                <p class="lead mb-4">Masa madre, ingredientes frescos y sabor tradicional.</p>
                <div class="row justify-content-center mb-3">
                    <div class="col-12 col-md-6">
                        <form class="d-flex gap-2" th:action="@{/categorias}" method="get">
                            <input type="search" class="form-control form-control-lg"
                                placeholder="¿Qué pizza te apetece hoy?">
                            <button class="btn btn-accent px-4" type="submit"><i class="bi bi-search"></i></button>
                        </form>
                    </div>
                </div>

                <div class="mt-3">
                    <a th:href="@{/categorias}" class="btn btn-main btn-lg px-4 me-4">Ver Menú</a>
                    <button class="btn btn-outline-light btn-lg px-4" data-bs-toggle="modal"
                        data-bs-target="#modalPromo">
                        Promo del Día
                    </button>
                </div>
            </div>
        </section>

        <section class="container my-5">
            <h2 class="text-center fw-bold mb-4">Nuestras Favoritas</h2>

            <div class="row g-4">
                <th:block th:each="pizza : ${favoritas}">
                    <div th:replace="~{fragments/cards :: tarjetaProducto(${pizza})}"></div>
                </th:block>
            </div>
        </section>
    </main>

    <!-- Modales -->
    <div th:replace="~{fragments/modals :: modalPromo}"></div>
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/scroll.js}"></script>
</body>

</html>
