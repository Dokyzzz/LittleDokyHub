<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperación de cuenta | Little Doky's Hub</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: header('')}"></div>
    <main class="auth-wrapper flex-grow-1">
        <section class="card card-register shadow-sm p-4">
            <div class="bullet-icon mb-2"><i class="bi bi-shield-lock"></i></div>
            <h1 class="auth-title h3 mb-3">Recuperación de cuenta</h1>
            <p class="text-secondary mb-4">El envío de códigos por correo no está configurado. Contacta al administrador para recuperar el acceso. No se ha enviado ningún código.</p>
            <a class="btn btn-accent w-100 fw-bold" th:href="@{/login}">
                <i class="bi bi-arrow-left me-1"></i>Volver al login
            </a>
        </section>
    </main>
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
