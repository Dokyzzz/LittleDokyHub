<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Little Doky's Hub</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: header('')}"></div>
    <main class="auth-wrapper flex-grow-1">
        <section class="card card-register shadow-sm p-4">
            <h1 class="auth-title h3 mb-3">Crear cuenta</h1>
            <div class="alert alert-danger py-2 small" role="alert" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success py-2 small" role="status" th:if="${exito}" th:text="${exito}"></div>
        <form th:action="@{/registro}" th:object="${registro}" method="post">
            <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}"
                th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            <label class="form-label fw-semibold small" for="nombre">Nombre completo</label>
            <input class="form-control form-control-custom p-2" th:field="*{nombre}" minlength="3" maxlength="100" required
                autocomplete="name" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

            <label class="form-label fw-semibold small mt-3" for="email">Correo</label>
            <input class="form-control form-control-custom p-2" type="email" th:field="*{email}" maxlength="100" required
                autocomplete="email" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label class="form-label fw-semibold small mt-3" for="telefono">Teléfono</label>
            <input class="form-control form-control-custom p-2" th:field="*{telefono}" maxlength="15" autocomplete="tel"
                th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>

            <label class="form-label fw-semibold small mt-3" for="password">Contraseña (8 a 72 caracteres)</label>
            <input class="form-control form-control-custom p-2" type="password" th:field="*{password}" minlength="8" maxlength="72"
                required autocomplete="new-password"
                th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <button class="btn btn-accent w-100 mt-4 fw-bold text-uppercase" type="submit">Registrarme</button>
        </form>
            <p class="small text-center mt-3 mb-0">¿Ya tienes cuenta? <a class="link-custom" th:href="@{/login}">Inicia sesión</a></p>
        </section>
    </main>
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
