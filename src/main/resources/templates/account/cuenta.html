<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi cuenta | Little Doky's Hub</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/header :: header('')}"></div>
    <main class="auth-wrapper flex-grow-1">
        <section class="card card-register shadow-sm p-4">
            <h1 class="auth-title h3 mb-3">Cambiar contraseña</h1>
            <div class="alert alert-danger py-2 small" th:if="${error}" th:text="${error}" role="alert"></div>
            <div class="alert alert-success py-2 small" th:if="${exito}" th:text="${exito}" role="status"></div>
            <form th:action="@{/cuenta/password}" method="post" class="mb-0">
                <label class="form-label fw-semibold small" for="actual">Contraseña actual</label>
                <input class="form-control form-control-custom p-2" id="actual" type="password" name="actual"
                    required autocomplete="current-password">
                <label class="form-label fw-semibold small mt-3" for="nueva">Nueva contraseña</label>
                <input class="form-control form-control-custom p-2" id="nueva" type="password" name="nueva"
                    required minlength="8" maxlength="72" autocomplete="new-password">
                <button class="btn btn-accent w-100 mt-4 fw-bold" type="submit">Guardar contraseña</button>
            </form>
        </section>
    </main>
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
