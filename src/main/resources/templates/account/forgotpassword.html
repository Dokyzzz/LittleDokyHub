<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Doky's Hub - Recuperar Contraseña</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: header('')}"></div>

    <main class="auth-wrapper flex-grow-1">
        <div class="card card-register shadow-sm p-4">
            <h3 class="auth-title text-uppercase mb-3">RECUPERAR CONTRASEÑA</h3>
            <p class="small text-muted mb-4">Ingresa tu correo electrónico registrado y te enviaremos un código de
                verificación.</p>

            <form id="forgotForm" th:action="@{/verifycode}" method="GET">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold small">
                        Correo electrónico <span class="text-danger">*</span>
                    </label>
                    <input type="email" class="form-control form-control-custom p-2" id="email" name="email"
                        placeholder="Ej. nombre@mail.com" required>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn btn-accent w-100 py-2 fw-bold text-uppercase shadow-sm">
                        ENVIAR CÓDIGO
                    </button>
                </div>

                <div class="text-center">
                    <a th:href="@{/login}" class="text-decoration-underline small link-custom">
                        <i class="bi bi-arrow-left"></i> Volver a Iniciar Sesión
                    </a>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/modals :: modalCarrito}"></div>
    <div th:replace="~{fragments/modals :: modalNotificacion}"></div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/recovery.js}"></script>
</body>

</html>
