<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Doky's Hub - Categorías</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header('categorias')}"></div>

    <main>
        <!-- Banner idéntico al Index adaptado para Categorías -->
        <section class="banner-principal text-center py-5">
            <div class="container py-4">
                <h1 class="display-5 fw-bold mb-3">Nuestras Categorías</h1>
                <p class="lead mb-4">Explora nuestras pizzas artesanales, recetas gourmet y bebidas refrescantes.</p>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    <a th:href="@{/categorias#clasicas}" class="btn btn-main px-4">Pizzas Clásicas</a>
                    <a th:href="@{/categorias#especiales}" class="btn btn-main px-4">Especiales & Fusión</a>
                    <a th:href="@{/categorias#bebidas}" class="btn btn-accent px-4">Bebidas</a>
                </div>
            </div>
        </section>

        <section class="container my-5" id="clasicas">
            <h2 class="text-center fw-bold mb-4">Pizzas Clásicas</h2>
            <div class="row g-4">
                <th:block th:each="pizza : ${clasicas}">
                    <div th:replace="~{fragments/cards :: tarjetaProducto(${pizza})}"></div>
                </th:block>
            </div>
        </section>

        <section class="container my-5" id="especiales">
            <h2 class="text-center fw-bold mb-4">Pizzas Especiales &amp; Fusión</h2>
            <div class="row g-4">
                <th:block th:each="pizza : ${especiales}">
                    <div th:replace="~{fragments/cards :: tarjetaProducto(${pizza})}"></div>
                </th:block>
            </div>
        </section>

        <section class="container my-5" id="bebidas">
            <h2 class="text-center fw-bold mb-4">Bebidas</h2>
            <div class="row g-4">
                <th:block th:each="bebida : ${bebidas}">
                    <div th:replace="~{fragments/cards :: tarjetaProducto(${bebida})}"></div>
                </th:block>
            </div>
        </section>
    </main>

    <!-- Modal Carrito -->
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>

    <!-- Footer -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/scroll.js}"></script>
</body>

</html>
