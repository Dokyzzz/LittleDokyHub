<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="personalizacion">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Personaliza tu ${tipoProducto} · Little Doky Hub|">Personaliza tu producto</title>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header('categorias')}"></div>
    <main class="container custom-wrap py-4 py-lg-5">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/categorias}">Menú</a></li>
                <li class="breadcrumb-item active" th:text="|Personaliza tu ${tipoProducto}|"></li>
            </ol>
        </nav>
        <div class="row g-4 g-lg-5">
            <div class="col-lg-5">
                <div class="bg-white rounded-4 p-3 p-lg-4 shadow-sm text-center position-sticky custom-product-sticky">
                    <span class="badge rounded-pill text-bg-warning mb-3" th:text="${tipoProducto == 'bebida' ? 'A TU GUSTO' : 'HECHA A TU GUSTO'}">A TU GUSTO</span>
                    <img class="pizza-photo" id="pizzaImage" th:src="@{${producto.imagenUrl}}"
                        th:alt="${producto.nombre}">
                    <h2 class="h3 fw-bold mt-3" th:text="${producto.nombre}" id="pizzaName">Pizza</h2>
                    <p class="text-secondary" th:text="${producto.descripcion}">Descripción</p>
                    <p class="small text-secondary" th:text="${tipoProducto == 'pizza' ? 'Recién horneada · Ingredientes frescos' : (tipoProducto == 'bebida' ? 'Elige cómo prefieres recibirla' : 'Preparada para acompañar tu pedido')}"></p>
                </div>
            </div>
            <div class="col-lg-7">
                <h1 class="display-6 fw-bold mb-1" th:text="|Personaliza tu ${tipoProducto}|"></h1>
                <p class="text-secondary mb-4">Elige entre las opciones disponibles. El precio se actualiza
                    automáticamente.</p>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                <form id="personalizar" th:action="@{/carrito/agregar}" method="post" th:attr="data-base=${producto.precio}">
                    <input type="hidden" name="productoId" th:value="${producto.id}">
                    <section class="mb-4" th:each="seccion, paso : ${secciones}">
                        <h2 class="h5 step-title" th:text="|${paso.count}. ${seccion.titulo}|"></h2>
                        <p th:if="${seccion.multiple}" class="small text-secondary">Opcional: puedes elegir varios extras.</p>
                        <div class="row g-2 mt-1">
                            <div class="col-sm-6" th:each="o, estado : ${seccion.opciones}">
                                <label class="option-card h-100">
                                    <input th:type="${seccion.multiple ? 'checkbox' : 'radio'}"
                                        th:name="${seccion.multiple ? 'opciones' : seccion.codigo}" th:value="${o.id}"
                                        th:checked="${!seccion.multiple and estado.first}"
                                        th:required="${!seccion.multiple}" th:attr="data-precio=${o.precio}">
                                    <span><b th:text="${o.nombre}"></b><small class="d-block text-success"
                                        th:text="${o.precio.signum() == 0 ? 'Incluido' : '+ S/ ' + #numbers.formatDecimal(o.precio,1,2)}"></small></span>
                                </label>
                            </div>
                        </div>
                    </section>
                    <p class="alert alert-info" th:if="${#lists.isEmpty(secciones)}">Este producto se ofrece en su presentación habitual, sin extras disponibles. Puedes elegir la cantidad.</p>
                    <label class="form-label" for="cantidad">Cantidad</label>
                    <div class="d-flex gap-3 align-items-center mb-3">
                        <button type="button" class="btn btn-outline-secondary" data-quantity-step="-1" aria-label="Reducir cantidad">−</button>
                        <input id="cantidad" class="form-control text-center" style="max-width:100px" type="number" name="cantidad" min="1"
                            th:max="${T(java.lang.Math).max(1,T(java.lang.Math).min(99,producto.stock))}" value="1" required>
                        <button type="button" class="btn btn-outline-secondary" data-quantity-step="1" aria-label="Aumentar cantidad">+</button>
                    </div>
                    <div class="sticky-total d-flex justify-content-between align-items-center">
                        <strong class="fs-3">S/ <span id="precio" th:text="${producto.precio}"></span></strong>
                        <button class="btn btn-main px-4 py-3" type="submit" th:disabled="${producto.stock == 0}">Agregar al pedido</button>
                    </div>
                    <p th:if="${producto.stock == 0}" class="text-danger mt-3">Producto agotado.</p>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/producto.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
