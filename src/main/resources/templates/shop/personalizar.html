<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personaliza tu producto | Little Doky's Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header('categorias')}"></div>
    <main class="container custom-wrap py-4 py-lg-5">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/categorias}">Menú</a></li>
                <li class="breadcrumb-item active">Personaliza tu producto</li>
            </ol>
        </nav>
        <div class="row g-4 g-lg-5">
            <div class="col-lg-5">
                <div class="bg-white rounded-4 p-3 p-lg-4 shadow-sm text-center position-sticky custom-product-sticky">
                    <span class="badge rounded-pill text-bg-warning mb-3">HECHA A TU GUSTO</span>
                    <img class="pizza-photo" id="pizzaImage" th:src="@{${producto.imagenUrl}}"
                        th:alt="${producto.nombre}">
                    <h2 class="h3 fw-bold mt-3" th:text="${producto.nombre}" id="pizzaName">Pizza</h2>
                    <p class="text-secondary" th:text="${producto.descripcion}">Descripción</p>
                    <div class="d-flex justify-content-center gap-3 small text-secondary"><span><i
                                class="bi bi-fire text-danger"></i> Recién horneada</span><span><i
                                class="bi bi-check-circle text-success"></i> Ingredientes frescos</span></div>
                </div>
            </div>
            <div class="col-lg-7">
                <h1 class="display-6 fw-bold mb-1">Personaliza tu producto</h1>
                <p class="text-secondary mb-4">Elige entre las opciones disponibles. El precio se actualiza
                    automáticamente.</p>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                <form id="personalizar" th:action="@{/carrito/agregar}" method="post" th:attr="data-base=${producto.precio}">
                    <input type="hidden" name="productoId" th:value="${producto.id}">
                    <section class="mb-4" th:each="grupo : ${ {'TAMANO','MASA','EXTRA'} }">
                        <h2 class="h5" th:text="${grupo == 'TAMANO' ? 'Tamaño' : (grupo == 'MASA' ? 'Masa' : 'Extras')}"></h2>
                        <label class="option-card mb-2" th:each="o : ${opciones}" th:if="${o.grupo == grupo}">
                            <input th:type="${grupo == 'EXTRA' ? 'checkbox' : 'radio'}"
                                th:name="${grupo == 'EXTRA' ? 'opciones' : grupo}" th:value="${o.id}"
                                th:required="${grupo != 'EXTRA'}" th:attr="data-precio=${o.precio}">
                            <span th:text="${o.nombre}"></span>
                            <span class="addon-price" th:text="|+ S/ ${#numbers.formatDecimal(o.precio,1,2)}|"></span>
                        </label>
                    </section>
                    <label class="form-label" for="cantidad">Cantidad</label>
                    <input id="cantidad" class="form-control mb-3" type="number" name="cantidad" min="1"
                        th:max="${T(java.lang.Math).min(99,producto.stock)}" value="1" required>
                    <div class="sticky-total d-flex justify-content-between align-items-center">
                        <strong class="fs-3">S/ <span id="precio" th:text="${producto.precio}"></span></strong>
                        <button class="btn btn-main px-4 py-3" type="submit" th:disabled="${producto.stock == 0}">Agregar al pedido</button>
                    </div>
                    <p th:if="${producto.stock == 0}" class="text-danger mt-3">Producto agotado.</p>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/producto.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
