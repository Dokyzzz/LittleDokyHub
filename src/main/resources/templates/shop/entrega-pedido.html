<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envío y pago | Little Doky's Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/style/styles.css}"></head><body>
<div th:replace="~{fragments/header :: header('categorias')}"></div>
<main class="container summary-wrap py-5"><h1 class="display-6 fw-bold mb-4">Envío y pago</h1>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form id="checkoutForm" th:action="@{/checkout/confirmar}" th:object="${checkout}" method="post" class="row g-4" th:attr="data-subtotal=${subtotal}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<div class="col-lg-7"><section class="checkout-card p-4">
<label class="form-label" for="entrega">Tipo de entrega</label>
<select id="entrega" th:field="*{entrega}" class="form-select mb-3"><option value="RECOJO">Recojo en tienda · sin costo</option><option value="DELIVERY">Delivery · S/ 5.00</option></select>
<div id="addressFields"><label for="direccion" class="form-label">Dirección de entrega</label>
<input id="direccion" th:field="*{direccion}" maxlength="255" class="form-control mb-3"></div>
<label for="pago" class="form-label">Método de pago</label>
<select id="pago" th:field="*{pago}" class="form-select"><option value="EFECTIVO">Efectivo al recibir o recoger</option><option value="TARJETA_AL_RECIBIR">Tarjeta al recibir o recoger</option></select>
</section></div><aside class="col-lg-5"><section class="checkout-card p-4">
<p th:text="|Productos: S/ ${#numbers.formatDecimal(subtotal,1,2)}|"></p>
<p>Envío: <span id="shippingCost">S/ 0.00</span></p><strong class="fs-3" id="finalTotal"></strong>
<button class="btn btn-main w-100 mt-3" type="submit" th:disabled="${!puedeConfirmar}">Confirmar pedido</button>
<p class="text-secondary mt-3">El pedido se registrará. El pago se realiza al recibir o recoger.</p>
<a th:if="${!sesionAutenticada}" th:href="@{/login}">Inicia sesión antes de confirmar tu pedido.</a>
<a th:href="@{/pedido/resumen}">Volver al resumen</a>
</section></aside></form>
</main><div th:replace="~{fragments/modals :: modalCarrito}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script><script th:src="@{/js/entrega-pedido.js}"></script></body></html>
