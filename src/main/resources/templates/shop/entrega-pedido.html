<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Envío y pago | Little Doky's Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style/styles.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header('categorias')}"></div>
    <main class="container checkout-wrap py-5"><a th:href="@{/pedido/resumen}" class="small text-decoration-none"><i
                class="bi bi-arrow-left me-1"></i>Volver al resumen</a>
        <h1 class="display-6 fw-bold mt-3">Envío y pago</h1>
        <p class="text-secondary">Selecciona cómo quieres recibir y pagar tu pedido.</p>
        <form id="checkoutForm" class="row g-4 mt-1">
            <div class="col-lg-7">
                <section class="checkout-card p-4 mb-4">
                    <h2 class="h5 fw-bold mb-3">1. Tipo de entrega</h2><label class="choice mb-2"><input type="radio"
                            name="delivery" value="delivery" checked><span><b><i
                                    class="bi bi-bicycle me-2 text-danger"></i>Delivery a domicilio</b><small
                                class="d-block text-secondary">Costo de envío: S/ 5.00</small></span></label><label
                        class="choice"><input type="radio" name="delivery" value="pickup"><span><b><i
                                    class="bi bi-shop me-2 text-danger"></i>Recojo en tienda</b><small
                                class="d-block text-secondary">Sin costo de envío</small></span></label>
                    <div id="addressFields" class="mt-3"><label class="form-label" for="address">Dirección de
                            entrega</label><input class="form-control" id="address" required
                            placeholder="Av. / calle, número, distrito"><label class="form-label mt-3"
                            for="reference">Referencia (opcional)</label><input class="form-control" id="reference"
                            placeholder="Ej. cerca del parque"></div>
                </section>
                <section class="checkout-card p-4">
                    <h2 class="h5 fw-bold mb-3">2. Método de pago</h2><label class="choice mb-2"><input type="radio"
                            name="payment" value="Efectivo" checked><span><b><i
                                    class="bi bi-cash-coin me-2 text-success"></i>Efectivo</b><small
                                class="d-block text-secondary">Paga al recibir o recoger tu
                                pedido</small></span></label><label class="choice"><input type="radio" name="payment"
                            value="Tarjeta al recibir"><span><b><i
                                    class="bi bi-credit-card me-2 text-primary"></i>Tarjeta</b><small
                                class="d-block text-secondary">Pago con tarjeta al
                                recibir/recoger</small></span></label>
                </section>
            </div>
            <div class="col-lg-5">
                <aside class="checkout-card p-4">
                    <h2 class="h5 fw-bold">Total del pedido</h2>
                    <div class="d-flex justify-content-between mt-3"><span class="text-secondary">Productos</span><span
                            id="productsTotal">S/ 0.00</span></div>
                    <div class="d-flex justify-content-between mt-2"><span class="text-secondary">Envío</span><span
                            id="shippingCost">S/ 5.00</span></div>
                    <hr>
                    <div class="d-flex justify-content-between"><b>Total</b><b class="fs-3" id="finalTotal">S/ 0.00</b>
                    </div><button class="btn btn-main w-100 py-3 mt-3" type="submit">Guardar selección</button>
                    <p class="small text-secondary mt-3 mb-0">Este prototipo guarda la selección en este navegador; no
                        procesa pagos reales.</p>
                    <div id="checkoutMessage" class="alert alert-success mt-3 d-none" role="status"></div>
                </aside>
            </div>
        </form>
    </main>
    <div th:replace="~{fragments/modals :: modalCarrito}"></div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/entrega-pedido.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
