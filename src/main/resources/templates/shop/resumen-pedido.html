<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen de tu pedido | Little Doky's Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/style/styles.css}"></head><body>
<div th:replace="~{fragments/header :: header('categorias')}"></div>
<main class="container summary-wrap py-5"><h1 class="display-6 fw-bold mb-4">Resumen de tu pedido</h1>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<div class="row g-4"><div class="col-lg-8"><section class="summary-card p-4">
<p th:if="${#lists.isEmpty(lineas)}">Tu carrito está vacío.</p>
<article class="border-bottom py-3" th:each="l : ${lineas}">
<h2 class="h5" th:text="${l.nombre}"></h2><p class="small text-secondary" th:text="${l.configuracion}"></p>
<p th:text="|Precio unitario: S/ ${#numbers.formatDecimal(l.precio,1,2)}|"></p>
<p class="text-danger" th:unless="${l.disponible}">Sin disponibilidad: revisa la cantidad o elimina esta selección.</p>
<form th:action="@{/carrito/cantidad}" method="post" class="d-flex gap-2 align-items-center">
<input type="hidden" name="id" th:value="${l.id}">
<label th:for="|cantidad-${l.id}|">Cantidad</label>
<input th:id="|cantidad-${l.id}|" type="number" class="form-control" style="max-width:90px" name="cantidad" min="0" max="99" th:value="${l.cantidad}" required>
<button class="btn btn-outline-secondary" type="submit">Actualizar</button>
<button class="btn btn-outline-danger" type="submit" th:formaction="@{/carrito/eliminar}">Quitar</button>
</form><strong th:text="|Subtotal: S/ ${#numbers.formatDecimal(l.subtotal,1,2)}|"></strong></article>
</section></div><aside class="col-lg-4"><div class="summary-card p-4">
<h2 class="h5">Total de productos</h2><p class="fs-3" th:text="|S/ ${#numbers.formatDecimal(subtotal,1,2)}|"></p>
<a th:if="${puedeConfirmar}" th:href="@{/pedido/entrega}" class="btn btn-main w-100">Continuar con envío y pago</a>
<a th:href="@{/categorias}" class="btn btn-outline-secondary w-100 mt-3">Seguir comprando</a>
</div></aside></div>
</main><div th:replace="~{fragments/modals :: modalCarrito}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script></body></html>
