<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido registrado | Little Doky's Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/style/styles.css}"></head><body>
<div th:replace="~{fragments/header :: header('categorias')}"></div>
<main class="container summary-wrap py-5"><h1 class="display-6 fw-bold mb-4">Pedido registrado</h1>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<section class="summary-card p-4"><h2 class="h4" th:text="|Pedido #${pedido.id}|"></h2>
<p th:text="|Estado: ${pedido.estado}|"></p>
<article th:each="d : ${detalles}" class="border-bottom py-3"><strong th:text="${d.nombre}"></strong>
<p th:text="${d.personalizacion}"></p><p th:text="|${d.cantidad} unidad(es) · S/ ${#numbers.formatDecimal(d.subtotal,1,2)}|"></p></article>
<div th:each="e : ${entrega}"><p th:text="|Entrega: ${e.entrega} · ${e.direccion}|"></p><p th:text="|Pago: ${e.pago}|"></p></div>
<strong class="fs-3" th:text="|Total: S/ ${#numbers.formatDecimal(pedido.total,1,2)}|"></strong>
<p class="text-secondary mt-3">Pendiente de pago al recibir o recoger.</p><a th:href="@{/categorias}">Volver al menú</a></section>
</main><div th:replace="~{fragments/modals :: modalCarrito}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script></body></html>
